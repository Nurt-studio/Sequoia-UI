name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "sequoia-web/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - name: Build book
        run: mdbook build docs
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sequoia-web/package-lock.json
      - name: Build web app
        working-directory: sequoia-web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/web/
        run: |
          npm ci
          npm run build
      - name: Copy web app into the Pages site
        run: cp -r sequoia-web/dist docs/book/web
      - name: Disable Jekyll
        run: touch docs/book/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
