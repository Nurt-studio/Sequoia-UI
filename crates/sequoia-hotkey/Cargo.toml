[package]
name = "sequoia-hotkey"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sequoia GUI framework — OS-global hotkeys (Windows RegisterHotKey)"
keywords.workspace = true
categories.workspace = true

[dependencies]
log = { workspace = true }
sequoia-input = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

# P3 audit: cargo does NOT allow overriding `workspace.lints` in a crate with
# `lints.workspace = true` — therefore hotkey repeats the table manually,
# with `unsafe_code = "allow"` (the only permitted `unsafe` in the workspace:
# Win32 FFI RegisterHotKey/UnregisterHotKey — see src/lib.rs).
[lints.rust]
unsafe_code = "allow"
# As in the workspace: no `missing_docs` (noise from ~4300 warnings).
missing_docs = "allow"
unreachable_pub = "warn"

[lints.clippy]
# As in the workspace (see the comment in the root Cargo.toml).
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
neg_cmp_op_on_partial_ord = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
inherent_to_string = "allow"
result_unit_err = "allow"
should_implement_trait = "allow"
