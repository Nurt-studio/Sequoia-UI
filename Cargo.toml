[workspace]
resolver = "3"
exclude = ["editors/zed-seq"]
members = [
    "crates/sequoia-core",
    "crates/sequoia-animation",
    "crates/sequoia-dock",
    "crates/sequoia-draw",
    "crates/sequoia-reactive",
    "crates/sequoia-preview",
    "crates/sequoia-seq",
    "crates/sequoia-seq-lsp",
    "crates/sequoia-view",
    "crates/sequoia-test",
    "crates/sequoia-layout",
    "crates/sequoia-input",
    "crates/sequoia-elements",
    "crates/sequoia-text",
    "crates/sequoia-render",
    "crates/sequoia-style",
    "crates/sequoia-assets",
    "crates/sequoia-platform",
    "crates/sequoia-hotkey",
    "crates/sequoia-async",
    "crates/sequoia-ui",
    "crates/sequoia-export",
    "crates/sequoia-buffer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
keywords = ["gui", "ui", "reactive", "widgets"]
categories = ["gui"]

[workspace.dependencies]
arboard = { version = "3", default-features = false }
bitflags = "2.6"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19.0"
futures-core = "0.3"
futures-task = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
pin-project-lite = "0.2"
pollster = "0.4"
rfd = { version = "0.15", default-features = false }
serde_json = "1.0"
unicode-segmentation = "1"
directories = "6.0"
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System", "Win32_System_Threading", "Win32_UI", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
wgpu = "29.0.4"
winit = "0.30"
sequoia-async = { version = "0.1.0", path = "crates/sequoia-async" }
sequoia-ui = { version = "0.1.0", path = "crates/sequoia-ui" }
sequoia-animation = { version = "0.1.0", path = "crates/sequoia-animation" }
sequoia-export = { version = "0.1.0", path = "crates/sequoia-export" }
sequoia-assets = { version = "0.1.0", path = "crates/sequoia-assets" }
sequoia-buffer = { version = "0.1.0", path = "crates/sequoia-buffer" }
sequoia-core = { version = "0.1.0", path = "crates/sequoia-core" }
sequoia-draw = { version = "0.1.0", path = "crates/sequoia-draw" }
sequoia-dock = { version = "0.1.0", path = "crates/sequoia-dock" }
sequoia-elements = { version = "0.1.0", path = "crates/sequoia-elements" }
sequoia-input = { version = "0.1.0", path = "crates/sequoia-input" }
sequoia-layout = { version = "0.1.0", path = "crates/sequoia-layout" }
sequoia-platform = { version = "0.1.0", path = "crates/sequoia-platform" }
sequoia-hotkey = { version = "0.1.0", path = "crates/sequoia-hotkey" }
sequoia-reactive = { version = "0.1.0", path = "crates/sequoia-reactive" }
sequoia-preview = { version = "0.1.0", path = "crates/sequoia-preview" }
sequoia-seq = { version = "0.1.0", path = "crates/sequoia-seq" }
sequoia-seq-lsp = { version = "0.1.0", path = "crates/sequoia-seq-lsp" }
sequoia-render = { version = "0.1.0", path = "crates/sequoia-render" }
sequoia-style = { version = "0.1.0", path = "crates/sequoia-style" }
sequoia-test = { version = "0.1.0", path = "crates/sequoia-test" }
sequoia-text = { version = "0.1.0", path = "crates/sequoia-text" }
sequoia-view = { version = "0.1.0", path = "crates/sequoia-view" }

[workspace.lints.rust]
unsafe_code = "forbid"
# Audyt P3: `missing_docs = "warn"` dawalo ~4300 ostrzezen (99% calego
# szumu `cargo check`) — dokumentacja do nadrobienia stopniowo, bez
# blokowania pracy. Wrocic z `warn`, gdy pokrycie doc przekroczy ~90%.
missing_docs = "allow"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Audyt P3 (korekta): `clippy::all` zostaje (realne błędy), ale `pedantic`
# dawal ~15k ostrzezen na tym kodzie (must_use_candidate / return_self...,
# builder API) — czysty szum. Ręcznie dopisane cast_* tez zdjete.
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
# Świadome wyjątki od `clippy::all` (decyzje projektowe, nie błędy):
# - neg_cmp_op_on_partial_ord: `!(a < b)` to zamierzony wzorzec NaN-safe,
# - too_many_arguments: publiczne API renderera/layoutu (ctx przekazywany wprost),
# - type_complexity: callbacki reaktywne mają z natury złożone typy,
# - inherent_to_string: `TextBuffer::to_string` to istniejące API publiczne,
# - result_unit_err: `Result<(), ()>` w SingleInstance jest celowe,
# - should_implement_trait: `LineIndex::from_str` jest infallible (nie FromStr).
neg_cmp_op_on_partial_ord = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
inherent_to_string = "allow"
result_unit_err = "allow"
should_implement_trait = "allow"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
